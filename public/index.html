<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <title>ChatRoom</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen" class="screen">
  <div class="auth-box">
    <h1>ChatRoom</h1>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>
    <div id="login-form">
      <input id="login-user" type="text" placeholder="Username" autocomplete="username" />
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="login-btn" onclick="login()">Login</button>
    </div>
    <div id="register-form" class="hidden">
      <input id="reg-user" type="text" placeholder="Username" autocomplete="username" />
      <input id="reg-pass" type="password" placeholder="Password" autocomplete="new-password" />
      <button id="register-btn" onclick="register()">Register</button>
    </div>
    <p id="auth-error" class="error"></p>
  </div>
</div>

<!-- App Screen -->
<div id="app-screen" class="screen hidden">

  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <span id="current-user-display" class="sidebar-username"></span>
      <button onclick="logout()" class="icon-btn" title="Logout">⏏</button>
      <button id="collapse-btn" onclick="toggleSidebar()" class="icon-btn" title="Collapse sidebar">‹</button>
    </div>
    <div class="room-create">
      <input id="new-room-name" type="text" placeholder="New room..." />
      <button onclick="createRoom()">+</button>
    </div>
    <ul id="room-list"></ul>
  </aside>

  <main id="chat-area">
    <header id="chat-header">
      <button id="menu-btn" class="icon-btn" onclick="openSidebar()">☰</button>
      <span id="room-title">Select a room</span>
      <span id="online-indicator"></span>
    </header>

    <div id="messages"></div>

    <!-- Edit mode indicator -->
    <div id="edit-banner" class="hidden">
      <span>✏️ Editing message</span>
      <button onclick="cancelEdit()">✕</button>
    </div>

    <div id="input-bar">
      <label class="icon-btn" title="Attach file">
        📎
        <input type="file" id="file-input" style="display:none" onchange="sendFile()" />
      </label>
      <button id="record-btn" class="icon-btn" title="Hold to record audio"
        onmousedown="startRecording()" onmouseup="stopRecording()"
        ontouchstart="startRecording(event)" ontouchend="stopRecording()">🎙</button>
      <input id="msg-input" type="text" placeholder="Message..."
        onkeydown="handleInputKey(event)" />
      <button onclick="sendOrSave()" class="send-btn">➤</button>
    </div>
  </main>
</div>

<!-- Context menu -->
<div id="ctx-menu" class="hidden">
  <button onclick="ctxReact()">😊 &nbsp;React</button>
  <button onclick="ctxEdit()">✏️ &nbsp;Edit</button>
  <hr/>
  <button class="danger" onclick="ctxDelete()">🗑 &nbsp;Delete</button>
</div>

<!-- Emoji Picker -->
<div id="emoji-picker" class="hidden">
  <div id="emoji-list"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
