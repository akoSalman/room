# DirectAdmin Apache Virtual Host config for chat.akosalman.com
# Place this inside your existing VirtualHost block for chat.akosalman.com
# or add it via DirectAdmin > Custom HTTPD Configurations

# Proxy all requests to the Node.js app on port 3001
ProxyRequests Off
ProxyPreserveHost On

# WebSocket upgrade support (required for Socket.IO)
RewriteEngine On
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/?(.*) ws://127.0.0.1:3001/$1 [P,L]

# HTTP requests
ProxyPass / http://127.0.0.1:3001/
ProxyPassReverse / http://127.0.0.1:3001/

# Required Apache modules (enable if not already):
# sudo a2enmod proxy proxy_http proxy_wstunnel rewrite
# sudo systemctl reload apache2
