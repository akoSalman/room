name: Rotate JWT_SECRET

# Generates a fresh strong JWT_SECRET on each chat server via a systemd drop-in
# and restarts the service. The secret is generated ON THE SERVER with openssl,
# is never printed and never leaves the host. All existing login tokens become
# invalid (everyone is logged out once), which also invalidates any forged ones.
on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: akosalman
            host_secret: DEPLOY_HOST_AKOSALMAN
            service_secret: DEPLOY_SERVICE_AKOSALMAN
          - name: bistbarg
            host_secret: DEPLOY_HOST_BISTBARG
            service_secret: DEPLOY_SERVICE_BISTBARG

    steps:
      - name: Rotate on ${{ matrix.name }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.host_secret] }}
          SERVICE: ${{ secrets[matrix.service_secret] }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SERVICE" ] || [ -z "$SSH_KEY" ]; then
            echo "Secrets for ${{ matrix.name }} not configured — skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$HOST" \
            SERVICE="$SERVICE" bash -s <<'EOF'
          set -e
          # The service secret may or may not carry a ".service" suffix. systemd
          # reads drop-ins from "<unit>.service.d" — building it from a name that
          # ALREADY ends in .service yields "<unit>.service.service.d", which
          # systemd silently ignores (the previous run's mistake). Normalise it.
          UNIT="${SERVICE%.service}"
          DROPIN="/etc/systemd/system/${UNIT}.service.d"
          # Clean up any wrong-path dir a prior run may have created.
          if [ "$SERVICE" != "$UNIT" ]; then rm -rf "/etc/systemd/system/${SERVICE}.service.d"; fi

          SECRET=$(openssl rand -hex 48)   # generated here; never echoed
          mkdir -p "$DROPIN"
          umask 077
          cat > "$DROPIN/jwt.conf" <<CONF
          [Service]
          Environment=JWT_SECRET=$SECRET
          CONF
          chmod 600 "$DROPIN/jwt.conf"
          systemctl daemon-reload
          systemctl restart "$UNIT"
          sleep 3

          # Verify against the ACTUAL running process environment (systemctl show
          # can mask/omit values), reporting only the length.
          PID=$(systemctl show "$UNIT" -p MainPID --value)
          LEN=0
          if [ -n "$PID" ] && [ "$PID" != "0" ] && [ -r "/proc/$PID/environ" ]; then
            LEN=$(tr '\0' '\n' < "/proc/$PID/environ" | sed -n 's/^JWT_SECRET=//p' | head -c 4096 | wc -c)
          fi
          echo "effective JWT_SECRET length in running process: $LEN"
          echo "Service active: $(systemctl is-active "$UNIT")"
          if [ "$LEN" -ge 32 ]; then echo "  ✅ rotation applied"; else echo "  🔴 secret still not in the process env"; fi
          # Probe the port the app actually listens on.
          PORT=$(ss -ltnp 2>/dev/null | grep -i node | grep -oE ':[0-9]+' | tr -d ':' | head -1)
          PORT=${PORT:-3000}
          curl -s -m 5 -o /dev/null -w "local HTTP %{http_code} on :$PORT\n" "http://127.0.0.1:$PORT/" || echo "app not responding on :$PORT"
          EOF
