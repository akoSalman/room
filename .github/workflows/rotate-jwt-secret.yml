name: Rotate JWT_SECRET

# Generates a fresh strong JWT_SECRET on each chat server via a systemd drop-in
# and restarts the service. The secret is generated ON THE SERVER with openssl,
# is never printed and never leaves the host. All existing login tokens become
# invalid (everyone is logged out once), which also invalidates any forged ones.
on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: akosalman
            host_secret: DEPLOY_HOST_AKOSALMAN
            service_secret: DEPLOY_SERVICE_AKOSALMAN
          - name: bistbarg
            host_secret: DEPLOY_HOST_BISTBARG
            service_secret: DEPLOY_SERVICE_BISTBARG

    steps:
      - name: Rotate on ${{ matrix.name }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.host_secret] }}
          SERVICE: ${{ secrets[matrix.service_secret] }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SERVICE" ] || [ -z "$SSH_KEY" ]; then
            echo "Secrets for ${{ matrix.name }} not configured — skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$HOST" \
            SERVICE="$SERVICE" bash -s <<'EOF'
          set -e
          # Generate the secret ON THIS HOST; it is never echoed.
          SECRET=$(openssl rand -hex 48)
          DROPIN="/etc/systemd/system/${SERVICE}.service.d"
          mkdir -p "$DROPIN"
          umask 077
          cat > "$DROPIN/jwt.conf" <<CONF
          [Service]
          Environment=JWT_SECRET=$SECRET
          CONF
          chmod 600 "$DROPIN/jwt.conf"
          systemctl daemon-reload
          systemctl restart "$SERVICE"
          sleep 3
          # Verify without revealing the value.
          COUNT=$(systemctl show "$SERVICE" -p Environment | grep -o 'JWT_SECRET=' | wc -l)
          LEN=$(systemctl show "$SERVICE" -p Environment | tr ' ' '\n' | sed -n 's/^JWT_SECRET=//p' | head -c 4096 | wc -c)
          echo "JWT_SECRET now set: $COUNT | length: $LEN chars"
          echo "Service active: $(systemctl is-active "$SERVICE")"
          # Confirm the app is answering after the restart.
          curl -s -m 5 -o /dev/null -w "local HTTP %{http_code}\n" http://127.0.0.1:3000/ || echo "app not responding on :3000"
          EOF
