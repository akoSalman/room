name: TURN Probe

# Read-only. Changes nothing on the server; asks it, in its own protocol,
# whether each transport the app offers a phone actually works.
#
# This replaces turnutils_uclient, which was run under `timeout` and therefore
# SIGTERMed with its buffered output still in it: three transports reported
# FAILED with not one line of explanation, a verdict indistinguishable from
# "the client was killed before it said anything".
#
# scripts/turn-probe.py sends a STUN binding request, then an unauthenticated
# Allocate, then a credentialed one, and names which step stopped — so
# "nothing is listening", "TURN is not serving this port" and "the credentials
# are wrong" stop looking alike. Its own test (test/turnProbe.test.js) checks
# it against a responder that verifies MESSAGE-INTEGRITY independently, after
# the first version misread the STUN header and called a working server
# unreachable.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bistbarg
            domain: chat.bistbarg.com
            host_secret: DEPLOY_HOST_BISTBARG
            service_secret: DEPLOY_SERVICE_BISTBARG
          - name: akosalman
            domain: chat.akosalman.com
            host_secret: DEPLOY_HOST_AKOSALMAN
            service_secret: DEPLOY_SERVICE_AKOSALMAN
    steps:
      - uses: actions/checkout@v4

      - name: Probe ${{ matrix.name }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.host_secret] }}
          SERVICE: ${{ secrets[matrix.service_secret] }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          SSH="ssh -i $HOME/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 root@$HOST"

          # From the service's own environment, whichever file put it there.
          # A guessed drop-in path is what made an earlier run exit before it
          # measured anything.
          CREDS=$($SSH "systemctl show \"$SERVICE\" -p Environment --value | tr ' ' '\n' | grep -E '^TURN_(USERNAME|PASSWORD|URL|ALT_PORT)='" || true)
          export TURN_USERNAME=$(printf '%s' "$CREDS" | sed -n 's/^TURN_USERNAME=//p' | head -1 | tr -d '\r')
          export TURN_PASSWORD=$(printf '%s' "$CREDS" | sed -n 's/^TURN_PASSWORD=//p' | head -1 | tr -d '\r')
          [ -n "$TURN_PASSWORD" ] && echo "::add-mask::$TURN_PASSWORD"
          [ -n "$TURN_USERNAME" ] && echo "::add-mask::$TURN_USERNAME"

          # Which of the four the app depends on are even set. Names and the
          # port only — the url carries the host, which the domain above
          # already names, and the other two are masked.
          echo "the service's TURN configuration:"
          for v in TURN_URL TURN_USERNAME TURN_PASSWORD TURN_ALT_PORT; do
            printf '  %-16s %s\n' "$v" \
              "$(printf '%s' "$CREDS" | grep -q "^$v=" && echo set || echo 'NOT SET')"
          done
          # The alt port decides whether a phone is offered the 443 route at
          # all, and it is a port number, not a secret.
          printf '  %-16s %s\n' 'TURN_ALT_PORT =' \
            "$(printf '%s' "$CREDS" | sed -n 's/^TURN_ALT_PORT=//p' | head -1)"
          echo ""

          # 3478 both ways, and 443 — the three the app hands a phone. A
          # non-OK transport exits 1, so the step must not die on the first.
          echo "== from the public internet (this runner), by NAME =="
          python3 -I scripts/turn-probe.py "$DOMAIN" 3478 3478/tcp 443 || true

          # ── Where the packets are lost ──────────────────────────────────────
          #
          # The runner reported all three transports unreachable while
          # per-pid attribution showed coturn listening on the public address
          # for both protocols. Those two facts cannot both be about coturn,
          # so the next question is not "is it listening" but "where does the
          # packet stop" — and the same probe, run in three places, says.
          #
          #   loopback      coturn itself answers, or it does not
          #   own public IP the host's own stack and any local firewall
          #   by name       DNS, and everything between here and there
          #
          # Working on loopback and failing by name from outside is a path
          # problem, and no amount of coturn configuration will touch it.
          echo ""
          echo "== by IP from the public internet, to rule DNS in or out =="
          # Resolved on the runner, compared on the runner, and NEITHER
          # printed: both are masked secrets, and these reports get pasted
          # into a repository that has been public. Only the verdict matters.
          # ── The host the APP is handed, which is the one that matters ──────
          #
          # This read $DOMAIN and announced "the app hands phones
          # turn:$DOMAIN:3478" on every run. That was true until TURN_URL was
          # repointed and false immediately afterwards, while still being
          # printed in bold — a line asserting something it had not measured,
          # which is the fault that has cost the most time here. It now takes
          # the host out of TURN_URL itself.
          TURN_HOST=$(printf '%s' "$CREDS" | sed -n 's/^TURN_URL=//p' | head -1 | tr -d '\r')
          TURN_HOST=${TURN_HOST#*:}; TURN_HOST=${TURN_HOST%%\?*}; TURN_HOST=${TURN_HOST%%:*}
          echo "  the host in TURN_URL, which is what phones are given: $TURN_HOST"
          RESOLVED=$(getent hosts "$TURN_HOST" | awk '{print $1; exit}')
          [ -n "$RESOLVED" ] && echo "::add-mask::$RESOLVED"
          if [ -z "$TURN_HOST" ]; then
            echo "  TURN_URL has no host — nothing to resolve"
          elif [ -z "$RESOLVED" ]; then
            echo "  it does not resolve from here at all"
          elif [ "$RESOLVED" = "$HOST" ] || [ "$TURN_HOST" = "$HOST" ]; then
            echo "  it points at the deploy host, which is where coturn runs."
            python3 -I scripts/turn-probe.py "$TURN_HOST" 3478 3478/tcp 443 || true
          else
            echo "  THE HOST IN TURN_URL IS NOT THE DEPLOY HOST."
            echo "  Phones send their STUN and TURN wherever it points, not to"
            echo "  the coturn that is running. That alone is relay=0 on every"
            echo "  phone, and srflx=0 with it, since our STUN is the same host."
            echo "  -- probing what TURN_URL points at --"
            python3 -I scripts/turn-probe.py "$TURN_HOST" 3478 3478/tcp 443 || true
            echo "  -- probing the DEPLOY host directly --"
            python3 -I scripts/turn-probe.py "$HOST" 3478 3478/tcp 443 || true
          fi
          # And the web name separately, because the two being different is
          # the whole finding and is worth seeing rather than inferring.
          WEB=$(getent hosts "$DOMAIN" | awk '{print $1; exit}')
          [ -n "$WEB" ] && echo "::add-mask::$WEB"
          if [ -n "$WEB" ] && [ "$WEB" != "$HOST" ]; then
            echo "  (for the record: $DOMAIN still resolves somewhere other than"
            echo "   the deploy host. That is fine for HTTPS and fatal for TURN,"
            echo "   which is why TURN_URL no longer uses it.)"
          fi

          echo ""
          echo "== from the server itself: is coturn answering anyone? =="
          scp -q -i ~/.ssh/k -o StrictHostKeyChecking=accept-new \
            scripts/turn-probe.py "root@$HOST:/tmp/turn-probe.py" || true
          $SSH "TURN_USERNAME='$TURN_USERNAME' TURN_PASSWORD='$TURN_PASSWORD' \
                python3 -I /tmp/turn-probe.py 127.0.0.1 3478 3478/tcp 443; \
                echo '-- and on its own public address --'; \
                TURN_USERNAME='$TURN_USERNAME' TURN_PASSWORD='$TURN_PASSWORD' \
                python3 -I /tmp/turn-probe.py \"\$(hostname -I | awk '{print \$1}')\" 3478 3478/tcp 443; \
                echo '-- any firewall in the way --'; \
                { nft list ruleset 2>/dev/null | head -30; iptables -S 2>/dev/null | head -30; \
                  ufw status 2>/dev/null | head -20; } | grep -vE '^\s*$' | head -40; \
                echo '(end of firewall rules)'; \
                rm -f /tmp/turn-probe.py" || true

          echo ""
          echo "== is the RUNNING server.js the one that builds this list? =="
          # The env can be perfect and reach nobody if the deployed code
          # predates iceConfig.js. /ice-config needs a login so it cannot be
          # curled from here, and "the config is right" has stood in for "the
          # phones are handed it" once too often today.
          $SSH "cd \$(systemctl show \"$SERVICE\" -p WorkingDirectory --value) 2>/dev/null || cd /root
                pwd | sed 's|^|  running from: |'
                if [ -f iceConfig.js ]; then echo '  iceConfig.js: present'
                else echo '  iceConfig.js: MISSING — the deployed code cannot build the list'; fi
                if grep -q 'iceConfig.iceServersFor' server.js 2>/dev/null; then
                  echo '  /ice-config routes through iceConfig: yes'
                else
                  echo '  /ice-config routes through iceConfig: NO — deployed server.js is older'
                  grep -n -A3 \"get('/ice-config'\" server.js 2>/dev/null | head -8 | sed 's/^/    /'
                fi
                # Whether the restart actually picked up this env, from the
                # process rather than from the unit file.
                pid=\$(systemctl show \"$SERVICE\" -p MainPID --value)
                if [ -n \"\$pid\" ] && [ \"\$pid\" != 0 ]; then
                  tr '\\0' '\n' < /proc/\$pid/environ 2>/dev/null \
                    | grep -c '^TURN_URL=' | sed 's|^|  TURN_URL in the live process: |'
                fi" || true

          echo ""
          echo "# UNREACHABLE on all three means the phones have nowhere to relay."
          echo "# OK on any one means relay=0 in the [call] log is about the phone's"
          echo "# network or the ice configuration it was handed, not this server."
