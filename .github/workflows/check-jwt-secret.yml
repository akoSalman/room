name: Check JWT_SECRET is set

# One-off security check: verifies each chat server sets JWT_SECRET in its
# systemd unit, so it is NOT falling back to the hardcoded default in server.js.
# Prints ONLY a count (0 or 1) and a masked length — never the secret value.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: akosalman
            host_secret: DEPLOY_HOST_AKOSALMAN
            service_secret: DEPLOY_SERVICE_AKOSALMAN
          - name: bistbarg
            host_secret: DEPLOY_HOST_BISTBARG
            service_secret: DEPLOY_SERVICE_BISTBARG

    steps:
      - name: Check ${{ matrix.name }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.host_secret] }}
          SERVICE: ${{ secrets[matrix.service_secret] }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SERVICE" ] || [ -z "$SSH_KEY" ]; then
            echo "Secrets for ${{ matrix.name }} not configured — skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$HOST" \
            SERVICE="$SERVICE" bash -s <<'EOF'
          # Count how many times JWT_SECRET appears in the unit's Environment,
          # and report only its LENGTH — never the value.
          COUNT=$(systemctl show "$SERVICE" -p Environment | grep -o 'JWT_SECRET=' | wc -l)
          echo "JWT_SECRET set in unit: $COUNT (1 = good, 0 = using the hardcoded fallback!)"
          if [ "$COUNT" -ge 1 ]; then
            LEN=$(systemctl show "$SERVICE" -p Environment | tr ' ' '\n' | sed -n 's/^JWT_SECRET=//p' | head -c 4096 | wc -c)
            echo "JWT_SECRET length: $LEN chars"
            if [ "$LEN" -lt 16 ]; then echo "  ⚠️  Short secret — consider a longer random value."; fi
          else
            echo "  🔴 CRITICAL: server is signing tokens with the public default secret."
          fi
          EOF
