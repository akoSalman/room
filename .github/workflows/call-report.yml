name: Call Report

# Why this exists.
#
# Reported: on some devices a call never connects and sits on "Connecting…".
# "Check the logs" had no answer, because until recently there was not one
# [call] line anywhere in server.js. There is now, and this reads it.
#
# What the numbers mean, and they are the whole point:
#
#   ans=0                  the far end never answered. Nothing about the
#                          network can be read from this call.
#   turn=0                 no TURN server was offered in the ICE config, so a
#                          phone behind carrier NAT had no way through.
#   turn=1 relay=0         a relay WAS offered and could not be reached from
#                          that device's network.
#   turn=1 relay>0         the relay worked; the fault is elsewhere.
#   srflx=0                STUN told the phone nothing. Ours points at a
#                          Google host, which these networks block.
#   outcome=stalled        ICE never finished and never admitted failure —
#                          the call the user watches sit on "Connecting…".
#
# NOTHING SECRET IS WRITTEN. The [call] line carries a numeric user id and
# counts; this report drops the id too. No addresses — an ICE candidate holds
# the phone's local AND public IP and none of it reaches the log by
# construction (see native-app/src/callFailure.ts). No tokens, no usernames,
# no SDP. diagnostics/ is committed to a repository that has been public, so
# it is written as if anyone will read it.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Which server to inspect'
        required: false
        default: 'bistbarg'
      since:
        description: 'How far back to look (journalctl --since, e.g. -14d)'
        required: false
        default: '-14d'

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Never fails the job. A diagnostic that disappears when the thing it is
      # diagnosing goes wrong is the opposite of useful: the report is always
      # written and always committed, and says so when it could not get an
      # answer.
      - name: Ask the server
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_B: ${{ secrets.DEPLOY_HOST_BISTBARG }}
          DIR_B: ${{ secrets.DEPLOY_DIR_BISTBARG }}
          SVC_B: ${{ secrets.DEPLOY_SERVICE_BISTBARG }}
          HOST_A: ${{ secrets.DEPLOY_HOST_AKOSALMAN }}
          DIR_A: ${{ secrets.DEPLOY_DIR_AKOSALMAN }}
          SVC_A: ${{ secrets.DEPLOY_SERVICE_AKOSALMAN }}
          BRAND: ${{ inputs.brand }}
          SINCE: ${{ inputs.since }}
        run: |
          set -u
          if [ "$BRAND" = "akosalman" ]; then
            HOST="$HOST_A"; APP_DIR="$DIR_A"; SERVICE="$SVC_A"
          else
            HOST="$HOST_B"; APP_DIR="$DIR_B"; SERVICE="$SVC_B"
          fi
          if [ -z "${HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "Secrets for $BRAND are not configured." | tee report.txt
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          set +e
          # Quoted for the REMOTE shell, which re-parses this command line.
          # Without it a value with spaces in it — "14 days ago", the default
          # until this was written — is split, and the remote tries to run
          # `days` as a command. That is what the first run of this workflow
          # did, and it is why the report is written even when the step fails:
          # the answer was exit 127 and nothing would have said so.
          Q_DIR=$(printf '%q' "$APP_DIR")
          Q_SVC=$(printf '%q' "$SERVICE")
          Q_SINCE=$(printf '%q' "$SINCE")
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "root@$HOST" \
            "APP_DIR=$Q_DIR SERVICE=$Q_SVC SINCE=$Q_SINCE bash -s" > report.txt 2>&1 <<'EOF'
          set +e
          cd "$APP_DIR" 2>/dev/null || { echo "APP_DIR missing"; exit 0; }

          echo "### is the version that reports this even running here"
          # The deploy is scp, not git, so git HEAD lies. The file is the
          # evidence — this is the check that caught bistbarg running code
          # from three weeks earlier.
          echo -n "server logs [call] at all: "
          grep -q "\[call\]" server.js 2>/dev/null && echo yes || echo "NO  <-- the deploy did not carry it"
          echo -n "ICE config offers a relay: "
          grep -q 'TURN_URL' server.js 2>/dev/null && echo "yes (if TURN_URL is set in the environment)" || echo "NO"
          echo -n "TURN_* actually in the service environment: "
          systemctl show "$SERVICE" -p Environment 2>/dev/null | grep -q 'TURN_URL' && echo yes || echo "NO  <-- /ice-config will offer STUN only"
          echo ""

          echo "### coturn"
          systemctl is-active coturn 2>/dev/null || echo "coturn not a known unit"
          # COUNTED BY ADDRESS, not the first four rows. This printed head -4
          # of each list, and after a restart reordered them it showed four
          # 127.0.0.1 lines — which reads exactly like "coturn is no longer
          # reachable from the internet" and is nothing of the kind. A
          # truncated list cannot answer the question being asked of it.
          echo "-- listeners by address (udp/tcp), both instances --"
          for port in 3478 443; do
            echo "  :$port"
            printf '    udp '; ss -lnup "sport = :$port" 2>/dev/null | tail -n +2 \
              | awk '{print $5}' | sed 's/:[0-9]*$//' | sort | uniq -c | tr '\n' ' '; echo
            printf '    tcp '; ss -lntp "sport = :$port" 2>/dev/null | tail -n +2 \
              | awk '{print $4}' | sed 's/:[0-9]*$//' | sort | uniq -c | tr '\n' ' '; echo
          done
          echo "-- the 443 instance --"
          systemctl is-active coturn-443 2>/dev/null || echo "not installed"
          echo "-- its own log --"
          tail -40 /var/log/turnserver/turn-443.log 2>/dev/null \
            | sed 's/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/-/g' \
            | grep -iE 'allocat|401|403|unauthor|listener|bind|error' | tail -12 || echo "(nothing)"
          # TCP MATTERS AS MUCH AS UDP. The ICE config offers both
          # turn:host:3478 and turn:host:3478?transport=tcp, and a carrier that
          # blocks or throttles UDP leaves the TCP url as the only way a phone
          # can allocate. Nothing had ever checked that it is listening: the
          # existing turn-test looks at `ss -lunp`, which is UDP only, and its
          # allocation probe runs from a runner where UDP works fine. Both
          # phones reported relay=0 while that probe said OK.
          echo "-- how coturn is configured (no credentials printed) --"
          grep -hE '^[[:space:]]*(listening-port|tls-listening-port|listening-ip|relay-ip|external-ip|min-port|max-port|no-tcp|no-udp|no-tls|no-dtls|realm|lt-cred-mech|use-auth-secret)' \
            /etc/turnserver.conf 2>/dev/null | head -20
          echo "-- firewall on the TURN ports --"
          { iptables -S 2>/dev/null | grep -E '3478|49152|5349' | head -8; } || echo "(iptables unreadable)"
          echo ""

          echo "### did the phones' allocate requests reach coturn"
          STRIP="s/[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}/-/g"
          # ── NO CLIENT ADDRESSES ─────────────────────────────────────────
          #
          # coturn logs the address of every client that talks to it, and
          # those are OUR USERS' addresses. This file is committed to a
          # repository that has been public, so nothing from those lines is
          # reproduced: only the SHAPE of what happened is counted, and the
          # sed below is a second line of defence in case a future grep here
          # is less careful than this one.
          #
          # What this answers: an allocation that was never requested means
          # the phone could not reach coturn at all, and one that was
          # requested and refused means it got there and was turned away.
          # Those have nothing in common as problems.
          # WHERE coturn logs, before reading anything. The journal came back
          # with two lines for a three-hour window that definitely contained a
          # successful allocation from a CI runner — which does not mean
          # nothing happened, it means the journal is not where this is
          # written. coturn's default is a log-file of its own. Reading an
          # empty journal and concluding the phones never arrived would have
          # been a confident wrong answer.
          echo "-- where coturn writes --"
          grep -hE '^[[:space:]]*(log-file|simple-log|verbose|no-stdout-log|syslog)' /etc/turnserver.conf 2>/dev/null \
            || echo "(nothing set: coturn defaults to /var/log/turn_*.log)"
          LOGS=$(ls -1t /var/log/turn*.log /var/log/turnserver/*.log 2>/dev/null | head -3)
          echo "log files present: ${LOGS:-none}"
          for f in $LOGS; do
            echo "-- $(basename "$f"): $(wc -l < "$f") lines, last modified $(date -u -r "$f" +%H:%MZ) --"
            grep -iE 'allocat|401|403|unauthor' "$f" 2>/dev/null | sed "$STRIP" | tail -8
          done
          echo "-- the journal --"
          if journalctl -u coturn --since "$SINCE" --no-pager >/dev/null 2>&1; then
            echo -n "lines coturn logged at all: "
            journalctl -u coturn --since "$SINCE" --no-pager 2>/dev/null | wc -l
            echo "-- what happened, counted --"
            journalctl -u coturn --since "$SINCE" --no-pager 2>/dev/null \
              | grep -oiE 'allocate|allocation|401|403|437|realm|unauthoris|unauthoriz|check_stun_auth|usage' \
              | tr 'A-Z' 'a-z' | sort | uniq -c | sort -rn | head -12
            echo "-- the most recent few, addresses removed --"
            journalctl -u coturn --since "$SINCE" --no-pager 2>/dev/null \
              | grep -iE 'allocat|401|403|unauthor' | sed "$STRIP" | tail -10
          else
            echo "coturn does not log to the journal here — check log-file in turnserver.conf"
            grep -hE '^[[:space:]]*(log-file|simple-log|verbose|no-stdout-log)' /etc/turnserver.conf 2>/dev/null
          fi
          echo ""

          echo "### every call, oldest first"
          # The user id is dropped: nothing here needs to say WHO called.
          journalctl -u "$SERVICE" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -F '[call]' \
            | sed 's/user=[0-9]*/user=-/' \
            | tail -200
          echo ""

          echo "### how they ended"
          journalctl -u "$SERVICE" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -F '[call]' | grep -o 'outcome=[a-z-]*' | sort | uniq -c | sort -rn
          echo ""

          echo "### what ICE managed, counted"
          for k in 'ans=0' 'ans=1' 'turn=0' 'turn=1' 'srflx=0' 'relay=0'; do
            n=$(journalctl -u "$SERVICE" --since "$SINCE" --no-pager 2>/dev/null \
                  | grep -F '[call]' | grep -c -- "$k")
            echo "$k : $n"
          done
          echo ""

          # ── Did the callee's phone RING, and if not which rule refused ──────
          #
          # Reported as: I am calling this phone with a good connection and it
          # does not ring on the receiver until I open the app.
          #
          # ringIncoming() used to have one caller in the whole app, the FCM
          # background task, so a phone rang only if a Google push arrived —
          # and nine of the fifteen users active this week have no push token
          # at all. The offer was reaching the socket the whole time. Calls now
          # ring from there, and each device says what it decided.
          #
          # reason=ok is a ring drawn from the app's own socket. Everything
          # else names the rule: app-active means the call was already on
          # screen, already-ringing means a re-delivered offer was not allowed
          # to restart the tone, room-call and no-sender are offers that must
          # not ring, ring-failed means the native ringer was unavailable.
          #
          # NO [ring] LINES AT ALL, with calls in the list above, means the
          # callee's app is older than this and has only the push route.
          echo "### whether the callee's phone rang, and why not"
          journalctl -u "$SERVICE" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -F '[ring]' | grep -o 'reason=[a-z-]*' | sort | uniq -c | sort -rn
          echo -n "[ring] lines at all: "
          journalctl -u "$SERVICE" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -c -F '[ring]'
          echo ""
          echo "### the ring decisions, oldest first (user id dropped)"
          journalctl -u "$SERVICE" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -F '[ring]' | sed 's/user=[0-9]*/user=-/' | tail -60
          EOF
          rc=$?
          echo "" >> report.txt
          echo "(ssh exit $rc)" >> report.txt
          exit 0

      - name: Commit the report
        if: always()
        run: |
          mkdir -p diagnostics
          {
            echo "# Call report — ${{ inputs.brand }}"
            echo ""
            echo "Generated $(date -u +%Y-%m-%dT%H:%MZ) by .github/workflows/call-report.yml"
            echo ""
            echo '```'
            cat report.txt 2>/dev/null || echo "(the server step produced no output at all)"
            echo '```'
          } > "diagnostics/call-report.md"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/call-report.md
          git commit -m "Call report for ${{ inputs.brand }} [skip ci]" || echo "no change"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
