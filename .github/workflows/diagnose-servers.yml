name: Diagnose Servers

# Read-only. Restarts nothing, deploys nothing, changes nothing.
#
# This exists because the only way to look inside these servers from here was
# to deploy to them, and a deploy restarts the service — which both destroys
# the evidence you are trying to collect and costs the OTHER server a few
# seconds of downtime for no reason. Diagnosis should not require a restart.
#
# It also looks BACKWARDS rather than at the current moment. By the time an
# outage is reported the box has usually been restarted, so "what is it doing
# now" answers the wrong question; the journal survives reboots, and that is
# where the answer actually is.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours back to look'
        required: false
        default: '8'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: akosalman
            host_secret: DEPLOY_HOST_AKOSALMAN
            app_dir_secret: DEPLOY_DIR_AKOSALMAN
            service_secret: DEPLOY_SERVICE_AKOSALMAN
          - name: bistbarg
            host_secret: DEPLOY_HOST_BISTBARG
            app_dir_secret: DEPLOY_DIR_BISTBARG
            service_secret: DEPLOY_SERVICE_BISTBARG

    steps:
      # Needed now that the remote script lives in the repo.
      - uses: actions/checkout@v4

      - name: Diagnose ${{ matrix.name }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.host_secret] }}
          APP_DIR: ${{ secrets[matrix.app_dir_secret] }}
          SERVICE: ${{ secrets[matrix.service_secret] }}
          HOURS: ${{ inputs.hours || '8' }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "Deploy secrets for ${{ matrix.name }} are not configured — skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The script is a FILE, not an inline heredoc. It outgrew what a
          # `run:` block can hold: a run block carrying any expression is
          # parsed as one, and GitHub caps those at 21000 characters, so the
          # workflow stopped being dispatchable at all. Piping the file over
          # ssh has no such limit, and the script is now shell-lintable and
          # diffable on its own.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$HOST" \
            "APP_DIR='$APP_DIR' SERVICE='$SERVICE' HOURS='$HOURS' bash -s" < .github/scripts/diagnose.sh
