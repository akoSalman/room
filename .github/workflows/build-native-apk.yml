name: Build Native APK

on:
  push:
    branches: ['claude/**', main, master]
    paths: ['native-app/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/chatroom.keystore \
            -alias chatroom \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ChatRoom,O=Android,C=US" \
            -storepass chatroom123 -keypass chatroom123 -noprompt

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('native-app/android/**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build release APK
        run: |
          KEYSTORE=$(pwd)/android/app/chatroom.keystore
          cd android && ./gradlew assembleRelease --no-daemon \
            -x lint -x lintVitalRelease -x lintReportRelease -x lintVitalAnalyzeRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE \
            -Pandroid.injected.signing.store.password=chatroom123 \
            -Pandroid.injected.signing.key.alias=chatroom \
            -Pandroid.injected.signing.key.password=chatroom123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatRoom-${{ github.run_number }}
          path: native-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
