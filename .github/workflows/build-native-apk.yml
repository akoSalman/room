name: Build Native APK

on:
  push:
    branches: ['claude/**', main, master]
    paths: ['native-app/**']
  workflow_dispatch:
    inputs:
      brand:
        description: 'Which app to build (both, bistbarg, akosalman)'
        required: false
        default: 'both'
        type: choice
        options: [both, bistbarg, akosalman]

jobs:
  build:
    runs-on: ubuntu-latest
    # Building is OPT-IN, deliberately.
    #
    # This used to build on every push unless the commit said [skip apk]. That
    # made "do not build" depend on remembering a magic string on every single
    # commit, and it silently failed the moment one was forgotten — five APKs
    # were built from commits that were never meant to produce one.
    #
    # The default is now "no build", which matches how this repo is actually
    # worked on: changes land continuously, and an APK is cut when someone
    # decides they want one. To get a build, either run this workflow manually
    # (Actions → Build Native APK → Run workflow) or put [build apk] in the
    # commit message.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build apk]')
    strategy:
      fail-fast: false
      matrix:
        brand: [akosalman, bistbarg]
    defaults:
      run:
        working-directory: native-app

    steps:
      # One brand at a time when asked for.
      #
      # The matrix is fixed rather than computed, because a computed matrix has
      # to be built by a separate job and read back as JSON — more machinery
      # than this needs. The unwanted job still starts, but it stops here, in a
      # couple of seconds, instead of spending a quarter of an hour on an APK
      # nobody asked for.
      - name: Skip ${{ matrix.brand }}?
        id: want
        # The job defaults every `run` to native-app/, which does not exist
        # until checkout — and this step runs BEFORE checkout, so it has to be
        # told to run from the workspace root or it cannot start at all.
        working-directory: ${{ github.workspace }}
        run: |
          WANTED="${{ inputs.brand || 'both' }}"
          if [ "$WANTED" != "both" ] && [ "$WANTED" != "${{ matrix.brand }}" ]; then
            echo "Only $WANTED was requested — skipping ${{ matrix.brand }}."
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.want.outputs.build == 'yes'

      - name: Set up Node.js
        if: steps.want.outputs.build == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        if: steps.want.outputs.build == 'yes'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: steps.want.outputs.build == 'yes'
        uses: android-actions/setup-android@v3

      - name: Apply brand config (name, package, API server)
        if: steps.want.outputs.build == 'yes'
        run: |
          BRAND_FILE="brands/${{ matrix.brand }}.json"
          BASE_URL=$(node -p "require('./${BRAND_FILE}').baseUrl")
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$(node -p "require('./${BRAND_FILE}').releaseTag")" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$(node -p "require('./${BRAND_FILE}').releaseTitle")" >> "$GITHUB_ENV"

          # Point the app at this brand's API server and its own release feed
          # (same stamping trick used for BUILD_VERSION below).
          node -e "
            const fs = require('fs');
            const brand = require('./${BRAND_FILE}');
            const path = 'src/api.ts';
            let src = fs.readFileSync(path, 'utf8');
            src = src.replace(/export const BASE_URL = '.*';/, \"export const BASE_URL = '\" + brand.baseUrl + \"';\");
            src = src.replace(/export const RELEASE_TAG = '.*';/, \"export const RELEASE_TAG = '\" + brand.releaseTag + \"';\");
            src = src.replace(/export const RELEASE_FILE = '.*';/, \"export const RELEASE_FILE = '\" + brand.releaseTitle + \"-latest.apk';\");
            fs.writeFileSync(path, src);
          "

          # Apply this brand's app name / slug / Android package.
          node -e "
            const fs = require('fs');
            const brand = require('./${BRAND_FILE}');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.name = brand.name;
            cfg.expo.slug = brand.slug;
            cfg.expo.android.package = brand.package;
            // Deep links: let this brand's own https://<host>/join/<id> links
            // open the app directly instead of bouncing to the browser.
            const host = new URL(brand.baseUrl).host;
            cfg.expo.android.intentFilters = [{
              action: 'VIEW',
              autoVerify: true,
              data: [{ scheme: 'https', host, pathPrefix: '/join' }],
              category: ['BROWSABLE', 'DEFAULT'],
            }];
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Stamp build version
        if: steps.want.outputs.build == 'yes'
        run: |
          echo "// Stamped by CI (build-native-apk.yml) with the GitHub Actions run number." > src/version.ts
          echo "export const BUILD_VERSION = ${{ github.run_number }};" >> src/version.ts
          # Enable Firebase push when this brand has a google-services.json committed
          if [ -f "brands/${{ matrix.brand }}/google-services.json" ]; then
            cp "brands/${{ matrix.brand }}/google-services.json" google-services.json
            node -e "
              const fs = require('fs');
              const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              cfg.expo.android.googleServicesFile = './google-services.json';
              fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
            "
          fi
          # Android only installs an update if versionCode increases
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.android.versionCode = ${{ github.run_number }};
            cfg.expo.version = '1.0.${{ github.run_number }}';
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Install dependencies
        if: steps.want.outputs.build == 'yes'
        run: npm install

      - name: Generate native Android project
        if: steps.want.outputs.build == 'yes'
        run: npx expo prebuild --platform android --no-install --clean

      # The release APK packed native libraries for all four ABIs; x86/x86_64
      # exist only for emulators. NOTE: setting `reactNativeArchitectures` alone
      # does NOT do this — it only controls what React Native compiles from
      # source, while prebuilt AARs (WebRTC especially) still contribute .so
      # files for every ABI. Real packaging filtering needs ndk.abiFilters in
      # the app module, injected here because prebuild regenerates the project.
      - name: Limit to real-device architectures
        if: steps.want.outputs.build == 'yes'
        run: |
          sed -i '/^reactNativeArchitectures=/d' android/gradle.properties
          echo 'reactNativeArchitectures=armeabi-v7a,arm64-v8a' >> android/gradle.properties
          node -e "
            const fs = require('fs');
            const p = 'android/app/build.gradle';
            let g = fs.readFileSync(p, 'utf8');
            if (g.includes('abiFilters')) { console.log('abiFilters already present'); process.exit(0); }
            const marker = 'defaultConfig {';
            const i = g.indexOf(marker);
            if (i < 0) { console.error('defaultConfig not found in build.gradle'); process.exit(1); }
            const inject = marker + '\n        ndk { abiFilters \'armeabi-v7a\', \'arm64-v8a\' }';
            g = g.slice(0, i) + inject + g.slice(i + marker.length);
            fs.writeFileSync(p, g);
            console.log('injected ndk.abiFilters');
          "
          grep -A 2 'defaultConfig {' android/app/build.gradle | head -5

      - name: Make gradlew executable
        if: steps.want.outputs.build == 'yes'
        run: chmod +x android/gradlew

      # Use the persistent keystore committed to the repo so every build has the
      # SAME signature — Android refuses to update an app when signatures differ,
      # which previously forced users to uninstall before installing a new build.
      # Safe to share across brands: Android app identity is (package name +
      # signature), and each brand has its own package name.
      - name: Copy persistent signing keystore
        if: steps.want.outputs.build == 'yes'
        run: cp signing/chatroom.keystore android/app/chatroom.keystore

      - name: Cache Gradle
        if: steps.want.outputs.build == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('native-app/android/**/*.gradle*') }}
          restore-keys: gradle-

      # Retried, because the thing that fails here is usually not the build.
      #
      # react-native-webrtc depends on `org.jitsi:webrtc:118.+`. A dynamic
      # version cannot be resolved from a cache — Gradle has to fetch the
      # version listing from Maven Central every time — and both brands build
      # at once, so the two jobs ask for the same metadata within a second of
      # each other. Maven Central answers a share of those with 429 Too Many
      # Requests, and Gradle treats that as a hard failure.
      #
      # Three attempts, spaced out. Nothing else in this step is worth
      # retrying: a real compile error fails the same way three times and
      # costs two extra minutes, whereas a 429 that is not retried costs the
      # whole build and a person's attention.
      - name: Build release APK
        if: steps.want.outputs.build == 'yes'
        run: |
          KEYSTORE=$(pwd)/android/app/chatroom.keystore
          cd android
          for attempt in 1 2 3; do
            echo "── gradle attempt $attempt ─────────────────────────────"
            if ./gradlew assembleRelease --no-daemon \
                -x lint -x lintVitalRelease -x lintReportRelease -x lintVitalAnalyzeRelease \
                -Pandroid.injected.signing.store.file=$KEYSTORE \
                -Pandroid.injected.signing.store.password=chatroom123 \
                -Pandroid.injected.signing.key.alias=chatroom \
                -Pandroid.injected.signing.key.password=chatroom123; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed; waiting $((attempt * 45))s before retrying."
              sleep $((attempt * 45))
            fi
          done
          echo "::error::Gradle failed three times."
          exit 1

      - name: Report APK size
        if: steps.want.outputs.build == 'yes'
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIZE=$(du -h "$APK" | cut -f1)
          echo "### ${{ matrix.brand }} APK: $SIZE" >> "$GITHUB_STEP_SUMMARY"
          echo "APK size: $SIZE"
          unzip -l "$APK" | awk '/lib\// {print $4}' | cut -d/ -f2 | sort -u | sed 's/^/  packaged ABI: /'

      # The release repo below is the real distribution channel; this artifact
      # is only a convenience copy. Short retention keeps it inside GitHub's
      # storage quota, and a quota failure must never block the release publish.
      - name: Upload APK
        if: steps.want.outputs.build == 'yes'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ env.RELEASE_TITLE }}-${{ github.run_number }}
          path: native-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 2

      # ── The real update channel: this brand's own server ──────────────────
      #
      # Asked for as: upload the newest version to each brand's server and get
      # the update from there instead of from GitHub.
      #
      # GitHub is unreliable at best and unreachable at worst for the people
      # this app is for — so the update check and the download both failed for
      # exactly the users who most needed them. The chat server, on the other
      # hand, is a host they are already talking to.
      #
      # Copied over SSH with the same key the server deploy uses: no upload
      # endpoint, no shared secret, nothing new exposed to the internet.
      - name: Publish APK to ${{ matrix.brand }}'s own server
        if: steps.want.outputs.build == 'yes'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.brand == 'akosalman' && 'DEPLOY_HOST_AKOSALMAN' || 'DEPLOY_HOST_BISTBARG'] }}
          APP_DIR: ${{ secrets[matrix.brand == 'akosalman' && 'DEPLOY_DIR_AKOSALMAN' || 'DEPLOY_DIR_BISTBARG'] }}
          VERSION: ${{ github.run_number }}
          TITLE: ${{ env.RELEASE_TITLE }}
        run: |
          if [ -z "$HOST" ] || [ -z "$APP_DIR" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::Deploy secrets for ${{ matrix.brand }} are not configured — the APK stays on GitHub only."
            exit 0
          fi
          APK=android/app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/apk_key
          chmod 600 ~/.ssh/apk_key
          SSH="ssh -i ~/.ssh/apk_key -o StrictHostKeyChecking=accept-new"
          # Uploaded beside the live file and moved into place afterwards: a
          # phone downloading while this runs must never get half a file.
          $SSH "root@$HOST" "mkdir -p '$APP_DIR/uploads/.app'"
          scp -i ~/.ssh/apk_key -o StrictHostKeyChecking=accept-new \
            "$APK" "root@$HOST:$APP_DIR/uploads/.app/latest.apk.part"
          $SSH "root@$HOST" \
            "APP_DIR='$APP_DIR' VERSION='$VERSION' SHA='$SHA' SIZE='$SIZE' TITLE='$TITLE' bash -s" <<'EOF'
          set -e
          cd "$APP_DIR/uploads/.app"
          # The manifest is written FIRST as a temp file and both are moved
          # into place together, so /app/latest.json never advertises a version
          # whose file is not there yet.
          cat > latest.json.part <<JSON
          {
            "version": $VERSION,
            "size": $SIZE,
            "sha256": "$SHA",
            "fileName": "$TITLE-v$VERSION.apk",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "Automated build $VERSION"
          }
          JSON
          mv -f latest.apk.part latest.apk
          mv -f latest.json.part latest.json
          ls -l latest.apk latest.json
          EOF
          echo "### ${{ matrix.brand }}: published v$VERSION to its own server" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish latest APK to public releases repo
        if: steps.want.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ../${{ env.RELEASE_TITLE }}-latest.apk
          gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag --repo akoSalman/room-releases || true
          gh release create "${{ env.RELEASE_TAG }}" ../${{ env.RELEASE_TITLE }}-latest.apk \
            --title "${{ env.RELEASE_TITLE }} v${{ github.run_number }}" \
            --notes "version:${{ github.run_number }} — automated build from commit ${{ github.sha }}. Always points to the most recent successful build." \
            --repo akoSalman/room-releases
