name: TURN Clean Restart

# Restarts coturn properly, so it can take the public TCP socket again.
#
# Established so far: coturn answers on UDP and TCP 3478, the relay range is
# open, and a real allocation with relay echo succeeds from a GitHub runner.
# Every phone still reports relay=0 — a relay offered and never obtained. What
# nothing can say is whether their allocate requests ARRIVE and are refused, or
# never arrive at all. Those are unrelated problems with unrelated fixes, and
# coturn is the only thing that knows.
#
# It currently writes nowhere: no log-file set, no files in /var/log, two lines
# in the journal for a window that contained a successful allocation.
#
# NOT verbose. coturn's default level already records allocations and session
# events, which is the whole question; verbose logs per-packet detail that
# would fill a disk nothing on these servers prunes. A size-bounded logrotate
# goes in at the same time for the same reason.
#
# Idempotent: re-running adds nothing it has already added.
on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Which server'
        required: false
        default: 'bistbarg'

jobs:
  turn-logging:
    runs-on: ubuntu-latest
    steps:
      - name: Clean restart of coturn
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ inputs.brand == 'akosalman' && secrets.DEPLOY_HOST_AKOSALMAN || secrets.DEPLOY_HOST_BISTBARG }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::deploy secrets are not configured for ${{ inputs.brand }}"; exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "root@$HOST" bash -s <<'EOF'
          set +e
          # ── What this is repairing ─────────────────────────────────────────
          #
          # coturn's TCP listeners on 3478 are all on 127.0.0.1. They were on
          # the public address before today's restarts, and its log says why:
          #
          #   Trying to bind fd 26 to <IP:3478>: errno=98
          #   Cannot bind TLS/TCP listener socket to addr IP:3478
          #
          # errno 98 is EADDRINUSE. `systemctl restart` started the new process
          # while the old one still held the socket, so it fell back to
          # localhost and stayed there. TURN over TCP is the fallback for
          # precisely the networks that block UDP — the ones being chased —
          # so this is not cosmetic.
          #
          # stop, wait for the port to actually be free, then start.
          echo "--- before ---"
          ss -lntp 'sport = :3478' 2>/dev/null | tail -n +2 | wc -l | sed 's/^/tcp 3478 listeners: /'

          systemctl stop coturn
          for i in $(seq 1 20); do
            ss -lntp 'sport = :3478' 2>/dev/null | tail -n +2 | grep -q . || break
            sleep 1
          done
          echo -n "port free after stop: "
          ss -lntp 'sport = :3478' 2>/dev/null | tail -n +2 | grep -q . && echo "NO" || echo yes
          systemctl start coturn
          sleep 4

          echo "--- after ---"
          systemctl is-active coturn
          for proto in tcp udp; do
            flag=$([ "$proto" = tcp ] && echo -lntp || echo -lnup)
            echo "  $proto 3478:"
            ss $flag 'sport = :3478' 2>/dev/null | tail -n +2 \
              | awk '{for(i=1;i<=NF;i++) if ($i ~ /:3478$/) {print $i; break}}' \
              | sed 's/:[0-9]*$//' | sort | uniq -c | sed 's/^/    local=/'
          done
          echo "  the 443 instance is untouched:"
          systemctl is-active coturn-443
          ss -lnup 'sport = :443' 2>/dev/null | tail -n +2 | wc -l | sed 's/^/    udp 443 listeners: /'
          echo ""
          echo "--- what it said this time ---"
          tail -40 /var/log/turnserver/turn.log 2>/dev/null \
            | grep -iE 'listener opened|cannot bind|errno' | tail -10
          EOF
