name: Setup TURN Server

# One-off/maintenance job: installs coturn on each chat server and wires the
# TURN_* env vars into the chatroom systemd service so WebRTC calls relay
# across restrictive networks (mobile carriers, strict NATs). Idempotent —
# re-running keeps the existing TURN password.
on:
  workflow_dispatch:

jobs:
  setup-turn:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: akosalman
            domain: chat.akosalman.com
            host_secret: DEPLOY_HOST_AKOSALMAN
            service_secret: DEPLOY_SERVICE_AKOSALMAN
          - name: bistbarg
            domain: chat.bistbarg.com
            host_secret: DEPLOY_HOST_BISTBARG
            service_secret: DEPLOY_SERVICE_BISTBARG

    steps:
      - name: Install and configure TURN on ${{ matrix.name }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.host_secret] }}
          SERVICE: ${{ secrets[matrix.service_secret] }}
          TURN_DOMAIN: ${{ matrix.domain }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SERVICE" ] || [ -z "$SSH_KEY" ]; then
            echo "Deploy secrets for ${{ matrix.name }} are not configured — skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$HOST" \
            TURN_DOMAIN="$TURN_DOMAIN" SERVICE="$SERVICE" bash -s <<'EOF'
          set -euo pipefail
          TURN_USER=chatturn
          # Normalize the unit name: the SERVICE secret may or may not carry
          # the .service suffix, and the drop-in dir must match the unit
          # exactly or systemd silently ignores it (the original calls bug).
          UNIT="${SERVICE%.service}.service"
          DROPIN_DIR="/etc/systemd/system/${UNIT}.d"
          DROPIN="${DROPIN_DIR}/turn.conf"
          # Migrate a drop-in previously written to a mismatched directory
          BAD_DIR="/etc/systemd/system/${SERVICE}.service.d"
          if [ "$BAD_DIR" != "$DROPIN_DIR" ] && [ -f "${BAD_DIR}/turn.conf" ]; then
            mkdir -p "$DROPIN_DIR"
            mv "${BAD_DIR}/turn.conf" "$DROPIN"
            rmdir "$BAD_DIR" 2>/dev/null || true
            echo "Migrated drop-in from ${BAD_DIR} to ${DROPIN_DIR}"
          fi

          # Keep the existing password on re-runs so clients/config stay valid
          if [ -f "$DROPIN" ] && grep -q TURN_PASSWORD "$DROPIN"; then
            TURN_PASS=$(grep -oP 'TURN_PASSWORD=\K.*' "$DROPIN")
            echo "Reusing existing TURN password from ${DROPIN}"
          else
            TURN_PASS=$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 24)
          fi

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y coturn

          cat > /etc/turnserver.conf <<CONF
          listening-port=3478
          fingerprint
          lt-cred-mech
          user=${TURN_USER}:${TURN_PASS}
          realm=${TURN_DOMAIN}
          no-cli
          no-tcp-relay
          denied-peer-ip=10.0.0.0-10.255.255.255
          denied-peer-ip=192.168.0.0-192.168.255.255
          denied-peer-ip=172.16.0.0-172.31.255.255
          total-quota=100
          stale-nonce=600
          CONF

          sed -i 's/#TURNSERVER_ENABLED=1/TURNSERVER_ENABLED=1/' /etc/default/coturn 2>/dev/null || true
          systemctl enable coturn
          systemctl restart coturn
          systemctl is-active coturn

          # Open firewall ports if a firewall is managing this box
          if command -v ufw >/dev/null && ufw status | grep -q "Status: active"; then
            ufw allow 3478/udp || true
            ufw allow 3478/tcp || true
            ufw allow 49152:65535/udp || true
          fi
          # CSF (DirectAdmin) firewall: allow TURN's listening port and the
          # UDP relay range, or media never reaches the relay.
          if command -v csf >/dev/null && [ -f /etc/csf/csf.conf ]; then
            add_csf_port() {
              VAR="$1"; PORT="$2"
              if ! grep -E "^${VAR} = " /etc/csf/csf.conf | grep -q "$PORT"; then
                sed -i -E "s/^(${VAR} = \")([^\"]*)/\1\2,${PORT}/" /etc/csf/csf.conf
                echo "CSF: added ${PORT} to ${VAR}"
              else
                echo "CSF: ${PORT} already in ${VAR}"
              fi
            }
            add_csf_port TCP_IN 3478
            add_csf_port TCP_OUT 3478
            add_csf_port UDP_IN 3478
            add_csf_port UDP_OUT 3478
            add_csf_port UDP_IN "49152:65535"
            add_csf_port UDP_OUT "49152:65535"
            csf -r >/dev/null 2>&1 || true
            echo "CSF reloaded"
          fi

          # Wire the TURN credentials into the chat service environment
          mkdir -p "$DROPIN_DIR"
          cat > "$DROPIN" <<UNIT
          [Service]
          Environment=TURN_URL=turn:${TURN_DOMAIN}:3478
          Environment=TURN_USERNAME=${TURN_USER}
          Environment=TURN_PASSWORD=${TURN_PASS}
          UNIT
          systemctl daemon-reload
          systemctl restart "$UNIT"
          systemctl is-active "$UNIT"

          echo "service environment now contains:"
          if systemctl show "$UNIT" -p Environment | tr ' ' '\n' | grep -E 'TURN_(URL|USERNAME)'; then
            echo "TURN env loaded OK"
          else
            echo "ERROR: TURN env still missing from ${UNIT}"; exit 1
          fi

          sleep 4
          echo "ice-config now returns:"
          curl -s http://127.0.0.1:3000/ice-config | sed "s/${TURN_PASS}/***/g" || echo "(app not reachable on 127.0.0.1:3000 — check manually)"
          echo ""
          echo "TURN setup complete on ${TURN_DOMAIN}"
          EOF
