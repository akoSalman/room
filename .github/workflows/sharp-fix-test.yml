name: Sharp Fix Test

# Does an older sharp run on this CPU? Tested in a scratch directory, so the
# running service is not touched until the answer is yes.
#
# What the diagnosis found on bistbarg:
#
#   Could not load the "sharp" module using the linux-x64 runtime
#   Unsupported CPU: Prebuilt binaries for Linux x64 require v2 microarchitecture
#   WebAssembly.Module(): Wasm SIMD unsupported
#
# Not a missing package — every @img/sharp-* binary is present. The CPU
# cannot execute them. sharp 0.33 raised its prebuilt baseline to
# x86-64-v2, and the WebAssembly fallback needs SIMD this CPU also lacks.
# akosalman is unaffected and makes thumbnails normally.
#
# sharp 0.32.6 is the last release before that change: it bundles its own
# libvips and targets baseline x86-64. The thumbnailer uses
# rotate().resize().jpeg().toFile(), which is unchanged between the two, so
# the only open question is whether the binary runs here — and that is a
# question to answer on the machine rather than from release notes.
#
# Building from source instead would mean building libvips too: this is
# Ubuntu with glibc 2.31, whose libvips is far older than sharp 0.35 needs.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Can an older sharp run on bistbarg's CPU?
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST_BISTBARG }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=60 \
            "root@$HOST" bash -s <<'EOF'
          set +e
          echo "### the CPU, and what x86-64-v2 asks for"
          grep -m1 'model name' /proc/cpuinfo | sed 's/^/  /'
          # Measured rather than inferred from the error message. v2 needs all
          # of these; naming the ones that are missing is the difference
          # between "the CPU is old" and knowing which capability is absent.
          for f in cx16 lahf_lm popcnt sse3 ssse3 sse4_1 sse4_2; do
            if grep -qm1 "\b$f\b" /proc/cpuinfo; then printf '  %-8s present\n' "$f"
            else printf '  %-8s MISSING\n' "$f"; fi
          done

          echo ""
          echo "### does sharp 0.32.6 load and actually resize?"
          # A scratch directory: the running service keeps its node_modules
          # untouched until this says yes. Installing into the app directory
          # to find out would be changing production to test a guess.
          rm -rf /tmp/sharp-probe && mkdir -p /tmp/sharp-probe && cd /tmp/sharp-probe
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund sharp@0.32.6 2>&1 | tail -3 | sed 's/^/  /'
          # Not just require(): a thumbnail, from bytes, to a file. require()
          # succeeding proves the module loaded; it does not prove libvips can
          # do the one thing it is here for.
          node -e "
            const sharp = require('sharp');
            sharp({ create: { width: 64, height: 48, channels: 3, background: '#4080c0' } })
              .png().toBuffer()
              .then(buf => sharp(buf).rotate()
                .resize(32, 32, { fit: 'cover', position: 'centre' })
                .jpeg({ quality: 72 }).toFile('/tmp/sharp-probe/out.jpg'))
              .then(info => console.log('SHARP 0.32.6 WORKS — wrote', info.width + 'x' + info.height, info.size + ' bytes'))
              .catch(e => { console.log('SHARP 0.32.6 FAILED'); console.log(String(e).split('\n').slice(0,6).join('\n')); });
          " 2>&1 | head -12 | sed 's/^/  /'
          rm -rf /tmp/sharp-probe
          EOF
