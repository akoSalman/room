name: Deploy to Servers

on:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'server.js'
      - 'db.js'
      # Required by server.js at startup — a change to it alone used to make
      # no deploy at all, leaving the servers on old credential rules.
      - 'credentials.js'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      # So a fix to the deploy script itself actually deploys.
      - '.github/workflows/deploy-servers.yml'
  workflow_dispatch:

jobs:
  # Gate: the integration suite boots the real server against a scratch DB and
  # drives it over HTTP + Socket.IO. A broken handler fails here instead of on
  # the users' servers.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node test/server.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: akosalman
            host_secret: DEPLOY_HOST_AKOSALMAN
            app_dir_secret: DEPLOY_DIR_AKOSALMAN
            service_secret: DEPLOY_SERVICE_AKOSALMAN
          - name: bistbarg
            host_secret: DEPLOY_HOST_BISTBARG
            app_dir_secret: DEPLOY_DIR_BISTBARG
            service_secret: DEPLOY_SERVICE_BISTBARG

    steps:
      - name: Deploy to ${{ matrix.name }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.host_secret] }}
          APP_DIR: ${{ secrets[matrix.app_dir_secret] }}
          SERVICE: ${{ secrets[matrix.service_secret] }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$HOST" ] || [ -z "$APP_DIR" ] || [ -z "$SERVICE" ] || [ -z "$SSH_KEY" ]; then
            echo "Deploy secrets for ${{ matrix.name }} are not configured — skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Print the key's fingerprint (not secret) so a mismatch with the
          # server's authorized_keys can be diagnosed from the run log.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/tmp/keyerr; then
            echo "::error::DEPLOY_SSH_KEY secret is not a valid private key: $(cat /tmp/keyerr)"
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
          # Quoted heredoc: NOTHING expands on the runner, so the script below is
          # the script the server runs. The three values it needs are passed as
          # environment assignments instead. (With an unquoted heredoc, every
          # server-side $var and $(...) would have been substituted here first.)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$HOST" \
            "APP_DIR='$APP_DIR' BRANCH='$BRANCH' SERVICE='$SERVICE' bash -s" <<'EOF'
          set -e
          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          # Hard reset, NOT pull. "npm install" rewrites package-lock.json on
          # the server, which left the checkout permanently dirty, and every
          # later "git pull" then aborted with "your local changes would be
          # overwritten". Both servers sat 13 commits behind because of it.
          # A deploy target holds no local edits worth keeping, so the remote
          # branch simply wins.
          #
          # Deliberately no "git clean": chat.db and uploads/ are untracked and
          # live in this directory. Cleaning would delete the database and every
          # uploaded file. reset --hard only touches TRACKED files, so user data
          # is untouched.
          git reset --hard "origin/$BRANCH"
          # "install", NOT "ci". `npm ci` deletes node_modules and reinstalls
          # strictly from the lock — and that is what took bistbarg down.
          # sharp's actual binary is an OPTIONAL platform dependency
          # (@img/sharp-linux-x64) whose engines field requires node >=20.9.0.
          # npm silently SKIPS an optional dep whose engine does not match, so
          # on a server with older node the wipe removed a working sharp and
          # installed nothing in its place. `npm install` leaves the existing,
          # working tree alone. The lock churn that "ci" was meant to prevent
          # no longer matters, because `git reset --hard` above cleans it.
          npm install --omit=dev
          # better-sqlite3 IS the database. Note the check OPENS a database:
          # `require('better-sqlite3')` alone proves nothing, because the
          # native binding is not loaded until `new Database()`. A require-only
          # check passed here while the service died on the next line.
          check_sqlite() { node -e "const D=require('better-sqlite3'); new D(':memory:').close()"; }
          if ! check_sqlite 2>/dev/null; then
            echo "Reinstalling better-sqlite3 to fetch its prebuilt binary."
            # Deleting the package makes `npm install` run its install script
            # again, which fetches a PREBUILT binary. Never --build-from-source:
            # better-sqlite3 needs C++20 and the g++ on at least one of these
            # servers is older than that, so a source build both fails AND
            # deletes the working binary it was meant to replace. That is
            # exactly how this server ended up crash-looping.
            rm -rf node_modules/better-sqlite3
            npm install --omit=dev
          fi
          if ! check_sqlite; then
            echo "::error::better-sqlite3 still cannot open a database — not restarting onto a broken build."
            exit 1
          fi
          # sharp only makes thumbnails, and server.js now loads it lazily, so
          # the app runs fine without it. Try to repair it, but NEVER fail the
          # deploy over it, and never --build-from-source: better-sqlite3 needs
          # C++20 and the g++ on at least one of these servers is too old for
          # that, so a source build turns a cosmetic problem into a failed
          # deploy.
          if ! node -e "require('sharp')" 2>/dev/null; then
            echo "sharp has no usable binary for this platform — trying to reinstall it."
            npm install --omit=dev --os=linux --cpu=x64 sharp || true
            node -e "require('sharp')" 2>/dev/null \
              || echo "::warning::sharp is unavailable, so thumbnails are disabled and full-size images are served instead. The app is otherwise fine. Node must be >=20.9.0 for sharp 0.35's prebuilt binary."
          fi
          # ── Health report, printed EVERY time, not only on failure ────────
          # There is no other way to see inside these boxes. They are not
          # reachable from the environment this repo is worked on from, so
          # "is it up, and if not why" arrives through this log or not at all.
          # Cheap to print, and useless if it only appears once something has
          # already gone wrong.
          echo "── disk ──";           df -h "$APP_DIR" / 2>/dev/null || true
          echo "── memory ──";         free -m 2>/dev/null | head -3 || true
          echo "── node ──";           node -v 2>/dev/null || true
          echo "── biggest dirs ──";   du -sh "$APP_DIR"/* 2>/dev/null | sort -h | tail -6 || true
          echo "── uptime / reboots ──"
          uptime 2>/dev/null || true
          last -x reboot 2>/dev/null | head -5 || true
          echo "── cpus / busiest processes ──"
          echo "cpus: $(nproc 2>/dev/null)"
          ps -eo pcpu,pmem,etimes,user,comm --sort=-pcpu 2>/dev/null | head -12 || true
          echo "── kernel: out-of-memory kills ──"
          journalctl -k --no-pager 2>/dev/null | grep -i -m5 'out of memory\|oom-killer' || echo "none"
          # The app can be perfectly healthy while nothing in front of it is.
          # "Not reachable" is at least as likely to be the web server, the
          # certificate or the firewall as it is to be node.
          echo "── front door ──"
          for p in nginx apache2 caddy; do
            systemctl is-active --quiet "$p" 2>/dev/null && echo "$p: active"
          done
          ss -ltnp 2>/dev/null | grep -E ':(80|443|3000)\b' || echo "nothing listening on 80/443/3000"
          echo "── certificate ──"
          found=0
          for c in /etc/letsencrypt/live/*/fullchain.pem /etc/ssl/certs/*chat*.crt /usr/local/lsws/conf/cert/*.crt /etc/pki/tls/certs/*.crt; do
            [ -f "$c" ] || continue
            found=1
            echo "$c: $(openssl x509 -enddate -noout -in "$c" 2>/dev/null)"
          done
          [ "$found" = 1 ] || echo "no certificate found in the usual places (a panel may manage them elsewhere)"
          echo "── journal before restart ──"
          journalctl -u "$SERVICE" -n 40 --no-pager 2>/dev/null || true

          systemctl restart "$SERVICE"
          # NOT "is-active" on its own: run straight after a restart it reports
          # success while the process is still starting, so a server that dies
          # a second later still passed. Give it time to fall over, then check
          # — and print the journal on failure so the reason is in THIS log
          # instead of needing someone to SSH in and look.
          sleep 8
          if ! systemctl is-active --quiet "$SERVICE"; then
            echo "::error::$SERVICE is not running after deploy."
            systemctl status "$SERVICE" --no-pager -l || true
            journalctl -u "$SERVICE" -n 60 --no-pager || true
            exit 1
          fi
          systemctl is-active "$SERVICE"
          # "active" only means the process exists. Ask it for something over
          # HTTP too: a server that is up but not answering is exactly what a
          # user reports as "not reachable", and systemd calls that healthy.
          # Ask the process which port it is on. ${PORT:-3000} looked right but
          # PORT is set in the systemd unit, not in this shell, so it always
          # fell back to 3000 — and akosalman serves on 3001. That reported a
          # perfectly healthy server as unreachable.
          nport=$(ss -ltnp 2>/dev/null | awk '/"node"/ {split($4,a,":"); print a[length(a)]; exit}')
          code=$(curl -sS -o /dev/null -m 10 -w '%{http_code}' "http://127.0.0.1:${nport:-3000}/" 2>/dev/null || echo 000)
          echo "node port: ${nport:-unknown}"
          echo "local HTTP check: $code"
          if [ "$code" = "000" ]; then
            echo "::warning::service is running but did not answer HTTP locally."
            journalctl -u "$SERVICE" -n 40 --no-pager || true
          fi
          EOF
          echo "Deployed to ${{ matrix.name }} and service is active."
