name: TURN Logging

# Switches coturn's logging on, because it is off and that is why the one
# question left about calls cannot be answered.
#
# Established so far: coturn answers on UDP and TCP 3478, the relay range is
# open, and a real allocation with relay echo succeeds from a GitHub runner.
# Every phone still reports relay=0 — a relay offered and never obtained. What
# nothing can say is whether their allocate requests ARRIVE and are refused, or
# never arrive at all. Those are unrelated problems with unrelated fixes, and
# coturn is the only thing that knows.
#
# It currently writes nowhere: no log-file set, no files in /var/log, two lines
# in the journal for a window that contained a successful allocation.
#
# NOT verbose. coturn's default level already records allocations and session
# events, which is the whole question; verbose logs per-packet detail that
# would fill a disk nothing on these servers prunes. A size-bounded logrotate
# goes in at the same time for the same reason.
#
# Idempotent: re-running adds nothing it has already added.
on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Which server'
        required: false
        default: 'bistbarg'

jobs:
  turn-logging:
    runs-on: ubuntu-latest
    steps:
      - name: Switch coturn logging on
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ inputs.brand == 'akosalman' && secrets.DEPLOY_HOST_AKOSALMAN || secrets.DEPLOY_HOST_BISTBARG }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::deploy secrets are not configured for ${{ inputs.brand }}"; exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "root@$HOST" bash -s <<'EOF'
          set -e
          CONF=/etc/turnserver.conf
          [ -f "$CONF" ] || { echo "no $CONF on this host"; exit 1; }
          cp -n "$CONF" "$CONF.before-logging" || true

          mkdir -p /var/log/turnserver
          chown turnserver:turnserver /var/log/turnserver 2>/dev/null || true

          # Added only if absent, so this can be run twice.
          grep -qE '^[[:space:]]*log-file=' "$CONF" || echo 'log-file=/var/log/turnserver/turn.log' >> "$CONF"
          grep -qE '^[[:space:]]*simple-log' "$CONF" || echo 'simple-log' >> "$CONF"
          # If something had silenced stdout AND there was no file, nothing was
          # written anywhere. Only the file matters now, but leaving a silencer
          # in place next to a fresh log-file would be confusing to read later.
          sed -i 's/^[[:space:]]*no-stdout-log/# no-stdout-log  # left off while diagnosing calls/' "$CONF" || true

          # Bounded, because nothing on this server prunes logs and the disk is
          # shared with every photo and video anyone has ever sent.
          cat > /etc/logrotate.d/turnserver <<'ROT'
          /var/log/turnserver/*.log {
            size 20M
            rotate 3
            compress
            missingok
            notifempty
            copytruncate
          }
          ROT

          echo "--- config now ---"
          grep -hE '^[[:space:]]*(log-file|simple-log|verbose|no-stdout-log)' "$CONF" || echo '(none)'
          systemctl restart coturn
          sleep 2
          echo "--- coturn after restart ---"
          systemctl is-active coturn
          ss -lnup | grep -c ':3478' | sed 's/^/udp listeners: /'
          ss -lntp | grep -c ':3478' | sed 's/^/tcp listeners: /'
          echo "--- is it writing? ---"
          ls -l /var/log/turnserver/ 2>/dev/null || echo "(no directory)"
          echo "Now make ONE call from the phone that fails, then run Call Report."
          EOF
