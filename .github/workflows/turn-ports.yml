name: TURN Ports

# READ ONLY. Changes nothing.
#
# Finds out what else coturn could listen on, because the evidence now says
# nothing from these phones reaches port 3478 at all:
#
#   * our own STUN on 3478 still gives srflx=0 on a phone, since deploy 227
#   * TURN on 3478, UDP and TCP, gives relay=0 on every end of every call
#   * coturn's log has not been written to since it was restarted, so nothing
#     is arriving — not refused, never seen
#   * and a GitHub runner allocates through it successfully, so the server and
#     its firewall are fine from the open internet
#
# 3478 is the well-known STUN/TURN port and an ordinary thing for a carrier to
# filter, while 443 to the same host plainly works — the app is using it. So
# the question is which other port coturn could answer on, and that depends on
# what this host already has bound and on how many addresses it has.
#
# Established so far: coturn answers on UDP and TCP 3478, the relay range is
# open, and a real allocation with relay echo succeeds from a GitHub runner.
# Every phone still reports relay=0 — a relay offered and never obtained. What
# nothing can say is whether their allocate requests ARRIVE and are refused, or
# never arrive at all. Those are unrelated problems with unrelated fixes, and
# coturn is the only thing that knows.
#
# It currently writes nowhere: no log-file set, no files in /var/log, two lines
# in the journal for a window that contained a successful allocation.
#
# NOT verbose. coturn's default level already records allocations and session
# events, which is the whole question; verbose logs per-packet detail that
# would fill a disk nothing on these servers prunes. A size-bounded logrotate
# goes in at the same time for the same reason.
#
# Idempotent: re-running adds nothing it has already added.
on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Which server'
        required: false
        default: 'bistbarg'

jobs:
  turn-logging:
    runs-on: ubuntu-latest
    steps:
      - name: Look at the ports
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ inputs.brand == 'akosalman' && secrets.DEPLOY_HOST_AKOSALMAN || secrets.DEPLOY_HOST_BISTBARG }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::deploy secrets are not configured for ${{ inputs.brand }}"; exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "root@$HOST" bash -s <<'EOF'
          set +e
          echo "### addresses on this host"
          ip -4 -o addr show scope global 2>/dev/null | awk '{print $2, $4}'
          echo ""
          echo "### what holds the useful ports"
          for p in 80 443 3478 5349; do
            echo "-- :$p --"
            ss -lntp "sport = :$p" 2>/dev/null | tail -n +2 | sed 's/users:(("\([^"]*\)".*/[\1]/' | head -4
            ss -lnup "sport = :$p" 2>/dev/null | tail -n +2 | sed 's/users:(("\([^"]*\)".*/[\1]/' | head -4
          done
          echo ""
          echo "### is UDP 443 free? (apache holds TCP 443; QUIC uses UDP 443)"
          ss -lnup 'sport = :443' 2>/dev/null | tail -n +2 | wc -l | sed 's/^/udp 443 listeners: /'
          echo ""
          echo "### coturn version and what it supports"
          turnserver -h 2>&1 | grep -ciE 'alt-listening-port' | sed 's/^/mentions alt-listening-port: /'
          turnserver -o -v 2>/dev/null | head -2
          rpm -q coturn 2>/dev/null || dpkg -l coturn 2>/dev/null | tail -1 || echo "(package query unavailable)"
          echo ""
          echo "### coturn config, ports only"
          grep -hE '^[[:space:]]*(listening-port|alt-listening-port|tls-listening-port|alt-tls-listening-port|listening-ip|relay-ip|external-ip|min-port|max-port)' /etc/turnserver.conf 2>/dev/null || echo '(none set)'
          echo ""
          echo "### firewall: which inbound ports are accepted"
          iptables -S INPUT 2>/dev/null | grep -E 'dport' | grep -oE 'dport[s]? [0-9:,]+' | sort -u | head -20
          EOF
