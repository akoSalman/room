name: Harden Servers

# Applies the four fixes for the outage of 16 Aug, where scanner traffic
# saturated PHP-FPM and MySQL on bistbarg until Apache had no CPU left to
# accept connections and the chat became unreachable — while node itself used
# 595ms of CPU and answered 200 on localhost throughout.
#
# Everything here is REVERSIBLE and prints its own undo command. Config files
# are backed up before they are touched, PHP-FPM's config is validated before
# it is reloaded, and nothing is restarted that does not have to be.
#
# Run from Actions → Harden Servers → Run workflow.
on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Which server (both, bistbarg, akosalman)'
        required: false
        default: 'both'
      apply:
        description: 'Type APPLY to make changes; anything else is a dry run'
        required: false
        default: 'APPLY'
      max_children:
        description: 'PHP-FPM pm.max_children ceiling (0 = leave alone)'
        required: false
        default: '12'
      deny_limit:
        description: 'csf DENY_IP_LIMIT to raise to (0 = leave alone)'
        required: false
        default: '500'
      block_xmlrpc:
        description: 'Deny /xmlrpc.php in apache and kill stuck workers (yes/no)'
        required: false
        default: 'no'
      quarantine:
        description: 'Quarantine detected web malware (yes/no)'
        required: false
        default: 'no'
      watchdog:
        description: 'Install/remove the 10-minute re-infection watchdog (yes/no/remove)'
        required: false
        default: 'no'
      php_cpu_quota:
        description: 'Percent of ONE cpu php-fpm may use in total; 400 = four of six cores (0 = no limit)'
        required: false
        default: '400'

jobs:
  harden:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: akosalman
            host_secret: DEPLOY_HOST_AKOSALMAN
            service_secret: DEPLOY_SERVICE_AKOSALMAN
          - name: bistbarg
            host_secret: DEPLOY_HOST_BISTBARG
            service_secret: DEPLOY_SERVICE_BISTBARG

    steps:
      # Needed now that the remote script lives in the repo.
      - uses: actions/checkout@v4

      - name: Harden ${{ matrix.name }}
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets[matrix.host_secret] }}
          SERVICE: ${{ secrets[matrix.service_secret] }}
          WANTED: ${{ inputs.server || 'both' }}
          APPLY: ${{ inputs.apply || 'APPLY' }}
          MAXKIDS: ${{ inputs.max_children || '12' }}
          QUOTA: ${{ inputs.php_cpu_quota || '400' }}
          DENYLIMIT: ${{ inputs.deny_limit || '500' }}
          QUARANTINE: ${{ inputs.quarantine || 'no' }}
          XMLRPC: ${{ inputs.block_xmlrpc || 'no' }}
          WATCHDOG: ${{ inputs.watchdog || 'no' }}
        run: |
          if [ "$WANTED" != "both" ] && [ "$WANTED" != "${{ matrix.name }}" ]; then
            echo "Not selected — skipping ${{ matrix.name }}."
            exit 0
          fi
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "Deploy secrets for ${{ matrix.name }} are not configured — skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The script is a FILE, not an inline heredoc. It outgrew what a
          # `run:` block can hold: a run block carrying any expression is
          # parsed as one, and GitHub caps those at 21000 characters, so the
          # workflow stopped being dispatchable at all. Piping the file over
          # ssh has no such limit, and the script is now shell-lintable and
          # diffable on its own.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "root@$HOST" \
            "SERVICE='$SERVICE' APPLY='$APPLY' MAXKIDS='$MAXKIDS' QUOTA='$QUOTA' DENYLIMIT='$DENYLIMIT' QUARANTINE='$QUARANTINE' WATCHDOG='$WATCHDOG' XMLRPC='$XMLRPC' bash -s" < .github/scripts/harden.sh
