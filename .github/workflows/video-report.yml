name: Video Report

# Why this exists.
#
# Reported as: a video received a moment ago, after downloading, will not
# play. Not an old one — a fresh one.
#
# That rules out the expired-link explanation and leaves two possibilities
# that need opposite fixes and look identical from the phone:
#
#   • the file on the SERVER is broken, in which case the upload is at fault
#     and nothing the receiving phone does can help. The chunked upload
#     handler was rewritten recently to stream chunks to disk as they arrive
#     rather than buffer them, which makes it the first thing to rule out;
#
#   • the file on the server is a perfectly good video, in which case the
#     fault is in fetching or playing it on the phone.
#
# A video file says which on its own. An MP4 begins with a box whose type is
# at bytes 4..8 and reads `ftyp`, and it needs a `moov` box somewhere or no
# player can do anything with it — a truncated or interleaved upload loses
# exactly that. Where ffprobe is installed it answers outright.
#
# NOTHING SECRET IS WRITTEN. Sizes, a four-byte box type, and whether a
# structural box is present. No filenames, no user ids, no frames, no
# content. diagnostics/ is committed to a repository that has been public, so
# it is written as if anyone will read it.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: 'Which server to inspect'
        required: false
        default: 'bistbarg'
      count:
        description: 'How many of the newest videos to check'
        required: false
        default: '12'

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Ask the server
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_B: ${{ secrets.DEPLOY_HOST_BISTBARG }}
          DIR_B: ${{ secrets.DEPLOY_DIR_BISTBARG }}
          HOST_A: ${{ secrets.DEPLOY_HOST_AKOSALMAN }}
          DIR_A: ${{ secrets.DEPLOY_DIR_AKOSALMAN }}
          BRAND: ${{ inputs.brand }}
          COUNT: ${{ inputs.count }}
        run: |
          set -u
          if [ "$BRAND" = "akosalman" ]; then
            HOST="$HOST_A"; APP_DIR="$DIR_A"
          else
            HOST="$HOST_B"; APP_DIR="$DIR_B"
          fi
          if [ -z "${HOST:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "Secrets for $BRAND are not configured." | tee report.txt
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          set +e
          Q_DIR=$(printf '%q' "$APP_DIR")
          Q_COUNT=$(printf '%q' "$COUNT")
          ssh -i ~/.ssh/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "root@$HOST" \
            "APP_DIR=$Q_DIR COUNT=$Q_COUNT bash -s" > report.txt 2>&1 <<'EOF'
          set +e
          cd "$APP_DIR" 2>/dev/null || { echo "APP_DIR missing"; exit 0; }

          echo "### which upload handler is running here"
          # The deploy is scp, not git, so git HEAD lies. The file is the
          # evidence — and the streaming handler is the suspect.
          echo -n "chunks streamed to disk as they arrive: "
          grep -q 'function streamChunkToPart' server.js 2>/dev/null \
            && echo "yes  <-- the rewritten handler" || echo "no   <-- the older buffering one"
          echo ""

          echo "### the newest uploads of ANY kind, by what they actually are"
          # Deliberately not assuming MP4. The first version of this report
          # globbed .webm in with the rest and tested every file for 'ftyp'
          # and 'moov' — boxes that exist only in MP4 — so a perfectly good
          # WebM came back looking like a corrupt video, and I read that as
          # the upload being broken. It was the test that was broken.
          #
          # The first four bytes say what a file IS, so they are what is
          # printed. No filenames.
          ls -t uploads/ 2>/dev/null | head -n 18 | while read -r b; do
            f="uploads/$b"
            [ -f "$f" ] || continue
            SIZE=$(stat -c%s "$f" 2>/dev/null)
            EXT="${b##*.}"
            MAGIC=$(dd if="$f" bs=1 count=4 2>/dev/null | od -An -tx1 | tr -d ' \n')
            case "$MAGIC" in
              1a45dfa3) KIND="webm/matroska" ;;
              *) case $(dd if="$f" bs=1 skip=4 count=4 2>/dev/null) in
                   ftyp) KIND="mp4/mov" ;;
                   *) case "$MAGIC" in
                        4f676753) KIND="ogg" ;;
                        52494646) KIND="riff(wav/avi)" ;;
                        89504e47) KIND="png" ;;
                        ffd8ff*)  KIND="jpeg" ;;
                        25504446) KIND="pdf" ;;
                        *) KIND="UNRECOGNISED" ;;
                      esac ;;
                 esac ;;
            esac
            AGE=$(( ( $(date +%s) - $(stat -c%Y "$f" 2>/dev/null) ) / 60 ))
            printf 'ext=%-6s size=%-10s magic=%-8s kind=%-14s age=%smin\n' \
              "$EXT" "$SIZE" "$MAGIC" "$KIND" "$AGE"
          done
          echo ""

          echo "### the newest videos, and whether they are videos"
          # An MP4's box type sits at bytes 4..8 and reads 'ftyp'. A file that
          # does not start that way was not written correctly, whatever its
          # size says. 'moov' is the index every player needs; a truncated or
          # mis-assembled upload is exactly what loses it.
          #
          # ONLY MP4-FAMILY FILES. The webm voice notes were globbed in here
          # and tested for boxes that exist only in MP4, so every one of them
          # came back looking corrupt — which is how this report lied the
          # first time it was run. They are listed above, by what they are.
          #
          # No filenames: only the size, the box type, and what was found.
          ls -t uploads/*.mp4 uploads/*.mov uploads/*.m4v 2>/dev/null \
            | head -n "$COUNT" | while read -r f; do
            [ "$(dd if="$f" bs=1 skip=4 count=4 2>/dev/null)" = "ftyp" ] || continue
            SIZE=$(stat -c%s "$f" 2>/dev/null)
            BOX=$(dd if="$f" bs=1 skip=4 count=4 2>/dev/null | tr -cd '[:print:]')
            # Searched in the first and last megabyte: faststart puts moov at
            # the front, a phone's recorder usually puts it at the end.
            HEAD_MOOV=$(dd if="$f" bs=1M count=1 2>/dev/null | grep -c moov)
            TAIL_MOOV=$(tail -c 1048576 "$f" 2>/dev/null | grep -c moov)
            AGE=$(( ( $(date +%s) - $(stat -c%Y "$f" 2>/dev/null) ) / 60 ))
            printf 'size=%-10s box=%-6s moov_head=%s moov_tail=%s age=%smin\n' \
              "$SIZE" "$BOX" "$HEAD_MOOV" "$TAIL_MOOV" "$AGE"
          done
          echo ""

          echo "### DOES THE BOX TREE REACH THE END OF THE FILE"
          # The question the columns above cannot answer, and the one that
          # matters: "ftyp is present and moov is present" is also true of a
          # file whose last megabyte never arrived. A player opens such a file
          # happily and then fails part way through, which is exactly how an
          # unplayable video is described.
          #
          # An MP4 is a list of boxes laid end to end, each announcing its own
          # length in its first four bytes, and together they must tile the
          # file EXACTLY. So: walk them. Landing past the end means a box
          # claims bytes that are not there — the file is truncated, and by
          # how much. Landing short means bytes nobody accounts for.
          #
          # No decoder and no dependencies: lengths and four-character types,
          # which is all this needs and all it may write down.
          ls -t uploads/*.mp4 uploads/*.mov uploads/*.m4v 2>/dev/null \
            | head -n 8 | while read -r f; do
            SIZE=$(stat -c%s "$f" 2>/dev/null)
            [ "$(dd if="$f" bs=1 skip=4 count=4 2>/dev/null)" = "ftyp" ] || continue
            # python3 does the whole walk in one pass where it exists. The
            # shell version below spawns three processes PER BOX, which is
            # why it needs a cap at all — and a cap is what made the first
            # run of this section lie: every file with more boxes than the
            # cap was reported as stopping short by whatever was left, which
            # reads exactly like a truncation and is not one.
            if command -v python3 >/dev/null 2>&1; then
              python3 - "$f" <<'PYEOF'
          import sys, os
          p = sys.argv[1]
          size = os.path.getsize(p)
          off = 0; chain = []; note = "ok"
          with open(p, 'rb') as fh:
              while off < size:
                  fh.seek(off)
                  hdr = fh.read(8)
                  if len(hdr) < 8:
                      note = "header past end"; break
                  bs = int.from_bytes(hdr[0:4], 'big')
                  ty = hdr[4:8].decode('ascii', 'replace')
                  if not all(c.isalnum() or c == ' ' for c in ty):
                      note = "not a box type"; break
                  if bs == 1:
                      ext = fh.read(8)
                      if len(ext) < 8:
                          note = "64-bit length past end"; break
                      bs = int.from_bytes(ext, 'big')
                  elif bs == 0:
                      bs = size - off
                  if bs < 8:
                      note = "box claims %d bytes" % bs; break
                  chain.append(ty)
                  off += bs
          if note == "ok":
              if off > size:
                  note = "TRUNCATED by %d bytes" % (off - size)
              elif off < size:
                  note = "stops %d bytes short" % (size - off)
          # Runs of the same type collapsed: a file can hold hundreds of mdat boxes
          # and printing each one buries the answer.
          out = []
          for t in chain:
              if out and out[-1][0] == t: out[-1][1] += 1
              else: out.append([t, 1])
          age = int((__import__('time').time() - os.path.getmtime(p)) / 60)
          print('size=%-10s age=%-7s %-26s boxes: %s' % (
              size, str(age) + 'min', note,
              ' '.join(t if n == 1 else '%sx%d' % (t, n) for t, n in out)))
          PYEOF
              continue
            fi
            OFF=0; CHAIN=""; NOTE="ok"
            WALKED=0
            for _ in $(seq 1 400); do
              [ "$OFF" -ge "$SIZE" ] && break
              WALKED=$((WALKED + 1))
              HDR=$(dd if="$f" bs=1 skip="$OFF" count=8 2>/dev/null | od -An -tx1 | tr -d ' \n')
              if [ "${#HDR}" -lt 16 ]; then NOTE="header past end"; break; fi
              BS=$((16#${HDR:0:8}))
              TY=$(dd if="$f" bs=1 skip=$((OFF+4)) count=4 2>/dev/null | tr -cd '[:alnum:] ')
              # A real box names itself in four characters. Without this check
              # a run of trailing nulls reads as a length of 0, which is legal
              # ONLY for the last box and means "to the end of the file" — so
              # 64 bytes of junk on the end of a truncated upload came back
              # "ok". Verified against a file built with exactly that.
              if [ "${#TY}" -ne 4 ]; then NOTE="not a box type"; break; fi
              if [ "$BS" -eq 1 ]; then
                # 64-bit length, in the eight bytes after the type.
                BIG=$(dd if="$f" bs=1 skip=$((OFF+8)) count=8 2>/dev/null | od -An -tx1 | tr -d ' \n')
                BS=$((16#$BIG))
              elif [ "$BS" -eq 0 ]; then
                # "to the end of the file", which is legal for the last box.
                BS=$((SIZE - OFF))
              fi
              if [ "$BS" -lt 8 ]; then NOTE="box claims $BS bytes"; break; fi
              CHAIN="$CHAIN $TY"
              OFF=$((OFF + BS))
            done
            # The cap is NOT an answer. Reaching it means the walk never got
            # to the end, so neither "short" nor "ok" may be claimed — the
            # first run of this section claimed "short" and that was wrong
            # about every file with a lot of boxes.
            if [ "$NOTE" = "ok" ] && [ "$WALKED" -ge 400 ] && [ "$OFF" -lt "$SIZE" ]; then
              NOTE="over 400 boxes, not walked"
            elif [ "$NOTE" = "ok" ]; then
              if [ "$OFF" -gt "$SIZE" ]; then
                NOTE="TRUNCATED by $((OFF - SIZE)) bytes"
              elif [ "$OFF" -lt "$SIZE" ]; then
                NOTE="stops $((SIZE - OFF)) bytes short"
              fi
            fi
            AGE=$(( ( $(date +%s) - $(stat -c%Y "$f" 2>/dev/null) ) / 60 ))
            printf 'size=%-10s age=%-7s %-26s boxes:%s\n' "$SIZE" "${AGE}min" "$NOTE" "$CHAIN"
          done
          echo ""

          echo "### WHERE the file actually starts"
          # The question the box column raises: is the beginning missing, and
          # if so how much? 'ftyp' is the first box of every MP4, so the
          # offset it is found at IS the number of bytes lost from the front.
          # A chunk-sized answer — 131072, 262144 — names the cause outright.
          ls -t uploads/*.mp4 uploads/*.mov uploads/*.m4v 2>/dev/null \
            | head -n 6 | while read -r f; do
            SIZE=$(stat -c%s "$f" 2>/dev/null)
            # Byte offset of the first 'ftyp', or nothing when there is none.
            AT=$(grep -abo -m1 ftyp "$f" 2>/dev/null | head -1 | cut -d: -f1)
            FIRST=$(dd if="$f" bs=1 count=12 2>/dev/null | od -An -tx1 | tr -s ' ')
            printf 'size=%-10s ftyp_at=%-10s first12=%s\n' "$SIZE" "${AT:-none}" "$FIRST"
          done
          echo ""

          echo "### what ffprobe makes of the newest one"
          # The outright answer where it is installed. "moov atom not found"
          # or "Invalid data" means the bytes on this server are wrong and no
          # phone can be blamed for refusing them.
          if command -v ffprobe >/dev/null 2>&1; then
            NEWEST=$(ls -t uploads/*.mp4 uploads/*.mov uploads/*.m4v 2>/dev/null | head -1)
            if [ -n "$NEWEST" ]; then
              ffprobe -v error -show_entries format=duration,size,format_name \
                -show_entries stream=codec_name,codec_type,width,height \
                -of default=noprint_wrappers=1 "$NEWEST" 2>&1 | head -20
            else
              echo "(no video files)"
            fi
          else
            echo "(ffprobe not installed — the box/moov columns above are the answer)"
          fi
          echo ""

          echo "### is anything half-uploaded and left behind"
          # A part file older than an hour is an upload that never finished.
          # If finished files are being assembled from these while a chunk is
          # still arriving, that is a different bug and this is where it shows.
          find uploads/.partial -type f 2>/dev/null | wc -l | sed 's/^/partials: /'
          find uploads/.partial -type f -mmin +60 2>/dev/null | wc -l | sed 's/^/older than an hour: /'
          echo ""

          echo "### recent upload trouble in the log"
          journalctl -u "$(systemctl list-units --type=service --plain --no-legend 2>/dev/null | grep -o '^[^ ]*chat[^ ]*' | head -1)" \
            --since '-2d' --no-pager 2>/dev/null \
            | grep -iE 'Write failed|Past end of file|Chunk already in flight|Incomplete' \
            | tail -20
          echo "(end)"
          EOF
          rc=$?
          echo "" >> report.txt
          echo "(ssh exit $rc)" >> report.txt
          exit 0

      - name: Commit the report
        if: always()
        run: |
          mkdir -p diagnostics
          {
            echo "# Video report — ${{ inputs.brand }}"
            echo ""
            echo "Generated $(date -u +%Y-%m-%dT%H:%MZ) by .github/workflows/video-report.yml"
            echo ""
            echo '```'
            cat report.txt 2>/dev/null || echo "(the server step produced no output at all)"
            echo '```'
          } > "diagnostics/video-report.md"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/video-report.md
          git commit -m "Video report for ${{ inputs.brand }} [skip ci]" || echo "no change"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"
